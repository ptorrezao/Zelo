name: _debug-dokploy-list
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: List Dokploy projects
        run: |
          curl -s "${{ vars.DOKPLOY_URL }}/api/project.all" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" | tee /tmp/out.json
          echo "---pretty---"
          cat /tmp/out.json | python3 -m json.tool || cat /tmp/out.json
