name: deploy

# Cada app e uma Application propria na Dokploy (nao um compose gigante) -
# ver infra/compose/README-dokploy.md. O deploy so corre a partir daqui,
# depois de TODOS os testes/builds passarem, nunca a partir dos workflows
# por-app individuais.
#
# NOTA: cada chamada a API da Dokploy so pede o deploy - nao espera que
# termine. A ordem abaixo (infra, migrator, api/worker, frontends) e a
# logica certa mas best-effort, nao ha garantia de que o migrator acabou
# antes da api arrancar.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-backend:
    uses: ./.github/workflows/backend.yml

  test-frontend:
    uses: ./.github/workflows/frontend-test.yml

  build-shell:
    uses: ./.github/workflows/frontend-shell.yml

  build-auto:
    uses: ./.github/workflows/frontend-auto.yml

  build-inventory:
    uses: ./.github/workflows/frontend-inventory.yml

  deploy:
    needs: [test-backend, test-frontend, build-shell, build-auto, build-inventory]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Deploy infra (LavinMQ, Garage, Jaeger, Unleash)
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${{ vars.DOKPLOY_COMPOSE_ID_INFRA }}\"}"

      - name: Deploy migrator
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_MIGRATOR }}\"}"

      - name: Deploy api
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_API }}\"}"

      - name: Deploy worker
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_WORKER }}\"}"

      - name: Deploy shell
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_SHELL }}\"}"

      - name: Deploy auto
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_AUTO }}\"}"

      - name: Deploy inventory
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_INVENTORY }}\"}"
