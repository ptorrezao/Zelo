name: deploy

# Cada app e uma Application propria na Dokploy (nao um compose gigante) -
# ver infra/compose/README-dokploy.md. As imagens sao compiladas aqui e
# publicadas no GHCR - a Dokploy so faz pull, nunca builda a partir do
# codigo (poupa CPU/RAM da VPS).
#
# Ordem: build das imagens primeiro, testes depois (gated por push-images),
# deploy so no fim, depois de tudo passar. Nunca a partir dos workflows
# por-app individuais.
#
# NOTA: cada chamada a API da Dokploy so pede o deploy - nao espera que
# termine. A ordem abaixo (infra, migrator, api/worker, frontends) e a
# logica certa mas best-effort, nao ha garantia de que o migrator acabou
# antes da api arrancar.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/zelo

jobs:
  push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/Dockerfile.backend
          - service: worker
            dockerfile: infra/docker/Dockerfile.backend
          - service: migrator
            dockerfile: infra/docker/Dockerfile.backend
          - service: shell
            dockerfile: infra/docker/Dockerfile.frontend
          - service: auto
            dockerfile: infra/docker/Dockerfile.frontend
          - service: inventory
            dockerfile: infra/docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test-backend:
    needs: push-images
    uses: ./.github/workflows/backend.yml

  test-frontend:
    needs: push-images
    uses: ./.github/workflows/frontend-test.yml

  build-shell:
    needs: push-images
    uses: ./.github/workflows/frontend-shell.yml

  build-auto:
    needs: push-images
    uses: ./.github/workflows/frontend-auto.yml

  build-inventory:
    needs: push-images
    uses: ./.github/workflows/frontend-inventory.yml

  deploy:
    needs: [test-backend, test-frontend, build-shell, build-auto, build-inventory]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Deploy infra (LavinMQ, Garage, Jaeger, Unleash)
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${{ vars.DOKPLOY_COMPOSE_ID_INFRA }}\"}"

      - name: Deploy migrator
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_MIGRATOR }}\"}"

      - name: Deploy api
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_API }}\"}"

      - name: Deploy worker
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_WORKER }}\"}"

      - name: Deploy shell
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_SHELL }}\"}"

      - name: Deploy auto
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_AUTO }}\"}"

      - name: Deploy inventory
        run: |
          curl --fail-with-body -X POST "${{ vars.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID_INVENTORY }}\"}"
