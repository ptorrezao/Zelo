<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zelo</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden;">{{Preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">
          <tr>
            <td style="padding:32px 32px 0 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:36px; height:36px; border-radius:10px; background-color:#0950c3; text-align:center; vertical-align:middle; font-weight:700; font-size:16px; color:#ffffff;">Z</td>
                  <td style="padding-left:10px; font-weight:600; font-size:16px; color:#1a1a2e;">Zelo</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px 32px;">
              <h1 style="margin:0; font-size:20px; line-height:28px; color:#1a1a2e;">{{Heading}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0 32px; font-size:14px; line-height:22px; color:#6b7280;">
              {{Body}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 32px 32px;">
              <div style="background-color:#f4f5f7; border-radius:8px; padding:16px; text-align:center; font-size:28px; font-weight:700; letter-spacing:6px; color:#1a1a2e;">{{Code}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; border-top:1px solid #e5e7eb; font-size:12px; color:#6b7280;">
              Se não foi você a pedir isto, pode ignorar este email em segurança.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
