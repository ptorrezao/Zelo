# Compose de INFRA usado pela Dokploy (dev e producao) - so os servicos de
# suporte que precisam de se falar por nome dentro do mesmo stack (LavinMQ,
# Garage, Unleash, Jaeger). NAO e o compose de desenvolvimento local (ver
# docker-compose.yml) nem contem as apps (api/worker/migrator/shell/auto/
# inventory) - essas sao Applications separadas na Dokploy, uma por app,
# ver infra/compose/README-dokploy.md. Postgres tambem nao esta aqui -
# usa a feature nativa "Database" da Dokploy (backups, Internal Host
# garantido a partir de qualquer Application).
#
#   - sem "ports": so fala pela rede interna do Docker - e o Traefik da
#     Dokploy que expoe o que precisar de ser publico, via Dominio.
#   - todos os segredos vem de variaveis de ambiente sem valor por omissao -
#     define-os no painel "Environment Variables" deste Compose na Dokploy.

name: zelo-infra

services:
  # Broker de mensagens (ver ADR-0002 / docker-compose.yml local).
  lavinmq:
    image: cloudamqp/lavinmq:latest
    volumes: ["lavinmqdata:/var/lib/lavinmq"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5672"]
      interval: 5s
      retries: 10

  # Armazenamento de documentos (S3-compatible). Layout/bucket/chave sao
  # criados pelo migrator (ver GarageBootstrap.cs) - precisa de alcancar
  # este servico pelo hostname "garage" (ver Network na Application dele).
  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ../docker/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  # Tracing distribuido.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Feature flags self-hosted. A base de dados dele (Postgres) vive fora
  # deste compose, na feature "Database" da Dokploy - ver
  # UNLEASH_DATABASE_URL no README-dokploy.md.
  unleash:
    image: unleashorg/unleash-server:latest
    environment:
      DATABASE_URL: ${UNLEASH_DATABASE_URL}
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: ${UNLEASH_API_TOKEN}

volumes:
  lavinmqdata:
  garagemeta:
  garagedata:
