services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zelo
      POSTGRES_PASSWORD: zelo
      POSTGRES_DB: zelo
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelo"]
      interval: 5s
      retries: 10

  migrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: migrator
    environment:
      ConnectionStrings__Zelo: "Host=db;Port=5432;Database=zelo;Username=zelo;Password=zelo"
    depends_on:
      db: { condition: service_healthy }

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: api
    environment:
      ConnectionStrings__Zelo: "Host=db;Port=5432;Database=zelo;Username=zelo;Password=zelo"
    ports: ["8080:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: worker
    environment:
      ConnectionStrings__Zelo: "Host=db;Port=5432;Database=zelo;Username=zelo;Password=zelo"
    depends_on:
      migrator: { condition: service_completed_successfully }

volumes:
  pgdata:
