name: zelo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zelo
      POSTGRES_PASSWORD: zelo
      POSTGRES_DB: zelo
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelo"]
      interval: 5s
      retries: 10

  migrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: migrator
    environment:
      ConnectionStrings__Zelo: "Host=db;Port=5432;Database=zelo;Username=zelo;Password=zelo"
      FeatureFlags__Url: "http://unleash:4242"
      FeatureFlags__ApiToken: "*:*.unleash-insecure-api-token"
      Storage__AdminUrl: "http://garage:3903"
      Storage__AdminToken: "a7cd1d89f750c10d8693ef94d6877b2c"
      Storage__Bucket: "zelo-documents"
      Storage__AccessKey: "GK150252b5f2fe57b6e3250b27"
      Storage__SecretKey: "bd257b59116ab67336fbe92145ffc0f7e4149d599f82070281dedd036af4579c"
    depends_on:
      db: { condition: service_healthy }
      unleash: { condition: service_started }
      garage: { condition: service_started }

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: api
    environment:
      ConnectionStrings__Zelo: "Host=db;Port=5432;Database=zelo;Username=zelo;Password=zelo"
      Messaging__Host: lavinmq
      Messaging__Port: "5672"
      Messaging__Username: guest
      Messaging__Password: guest
      Messaging__VirtualHost: "/"
      Storage__Endpoint: "http://localhost:3900"
      Storage__Region: "garage"
      Storage__Bucket: "zelo-documents"
      Storage__AccessKey: "GK150252b5f2fe57b6e3250b27"
      Storage__SecretKey: "bd257b59116ab67336fbe92145ffc0f7e4149d599f82070281dedd036af4579c"
      Otel__Endpoint: "http://jaeger:4317"
      FeatureFlags__Url: "http://unleash:4242"
      FeatureFlags__ApiToken: "*:*.unleash-insecure-api-token"
      Email__SmtpHost: mailhog
      Email__SmtpPort: "1025"
    ports: ["8080:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }
      lavinmq: { condition: service_healthy }
      garage: { condition: service_started }

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: worker
    environment:
      ConnectionStrings__Zelo: "Host=db;Port=5432;Database=zelo;Username=zelo;Password=zelo"
      Messaging__Host: lavinmq
      Messaging__Port: "5672"
      Messaging__Username: guest
      Messaging__Password: guest
      Messaging__VirtualHost: "/"
      Storage__Endpoint: "http://localhost:3900"
      # So o worker faz upload direto (UploadAsync, ver VehiclePhotoHandler)
      # - Storage__Endpoint tem de ficar "localhost" para as URLs
      # pre-assinadas que o browser usa, mas dentro deste container
      # "localhost" e o proprio container, nao o Garage (ver
      # StorageOptions.InternalEndpoint).
      Storage__InternalEndpoint: "http://garage:3900"
      Storage__Region: "garage"
      Storage__Bucket: "zelo-documents"
      Storage__AccessKey: "GK150252b5f2fe57b6e3250b27"
      Storage__SecretKey: "bd257b59116ab67336fbe92145ffc0f7e4149d599f82070281dedd036af4579c"
      Otel__Endpoint: "http://jaeger:4317"
      FeatureFlags__Url: "http://unleash:4242"
      FeatureFlags__ApiToken: "*:*.unleash-insecure-api-token"
      Email__SmtpHost: mailhog
      Email__SmtpPort: "1025"
      # So o worker gera fotos (ver VehiclePhotoHandler) - definida em
      # infra/compose/.env (nao commitado, ver .env.example), vazia por
      # omissao. Sem chave, a geracao falha com 401 e fica so a logar um
      # warning - nunca bloqueia a criacao do veiculo.
      OpenAi__ApiKey: "${OPENAI_API_KEY:-}"
    depends_on:
      migrator: { condition: service_completed_successfully }
      lavinmq: { condition: service_healthy }

  # Broker de mensagens: substitui o bus em processo (ADR-0002). Wire-compatible
  # com AMQP 0-9-1 / RabbitMQ.Client. UI de management em :15672 (guest/guest).
  # NOTA: a imagem nao suporta definir a password do utilizador por defeito
  # via env var (so teria efeito com um hash pre-calculado) - fica-se com
  # guest/guest, que ja e acessivel fora de loopback por defeito na imagem.
  lavinmq:
    image: cloudamqp/lavinmq:latest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes: ["lavinmqdata:/var/lib/lavinmq"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5672"]
      interval: 5s
      retries: 10

  # Armazenamento de documentos (S3-compatible, self-hosted). Layout,
  # bucket e chave sao criados pelo migrator (ver GarageBootstrap.cs) -
  # nao e preciso nenhum passo manual.
  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ../docker/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC (cluster, sem uso num nó unico)
      - "3903:3903" # admin API

  # So para desenvolvimento local: navegar o bucket do Garage pela linha
  # de comandos (ver README.md, seccao Garage) - o Garage nao tem UI web
  # propria. Nao arranca com "docker compose up -d" sozinho (profile
  # dedicado) - so quando pedido, com "docker compose --profile tools up -d".
  # host.docker.internal (nao "garage", nao "localhost") porque tem de
  # resolver tanto de dentro do container (docker compose exec) como do
  # browser no Windows host (mc share download imprime um URL com este
  # host - o Docker Desktop para Windows resolve-o dos dois lados).
  s3-browser:
    image: quay.io/minio/mc:latest # minio/mc no Docker Hub foi descontinuado
    profiles: ["tools"]
    volumes:
      # "mc cp" para aqui poe o ficheiro acessivel diretamente no host,
      # sem depender de nenhum URL/porta partilhada entre container e
      # Windows (host.docker.internal nao resolveu de forma fiavel aqui).
      - ./s3-downloads:/downloads
    entrypoint: >
      /bin/sh -c "
      mc alias set garage http://garage:3900 GK150252b5f2fe57b6e3250b27 bd257b59116ab67336fbe92145ffc0f7e4149d599f82070281dedd036af4579c &&
      tail -f /dev/null
      "
    depends_on:
      garage: { condition: service_started }

  # Captura emails localmente (confirmacao de conta, reset de password).
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web

  # Tracing distribuido. Recebe OTLP do Zelo.ServiceDefaults.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Feature flags self-hosted (Apache-2.0, sem edicao paga escondida).
  unleash-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
      POSTGRES_DB: unleash
    volumes: ["unleashdbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash"]
      interval: 5s
      retries: 10

  unleash:
    image: unleashorg/unleash-server:latest
    environment:
      DATABASE_URL: "postgres://unleash:unleash@unleash-db:5432/unleash"
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-api-token"
    ports: ["4242:4242"]
    depends_on:
      unleash-db: { condition: service_healthy }

volumes:
  pgdata:
  lavinmqdata:
  garagemeta:
  garagedata:
  unleashdbdata:
